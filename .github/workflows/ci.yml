name: CI

# 每次推送到 main 或发起 PR 时，自动做语法检查与规则单元测试
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax & Rules unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 本项目测试零第三方依赖（使用 Node 内置 node:test），无需 npm install
      - name: 内联模块语法检查
        run: npm run check:inline

      - name: 独立 JS 文件语法检查
        run: npm run check:js

      - name: 规则内核单元测试
        run: npm test
